openapi: 3.0.3
info:
  title: TCG Collection Manager API
  description: REST API for managing trading card game collections, including games, sets, cards, user collections, decks, and booster packs.
  version: 0.2.0

servers:
  - url: http://localhost:8000
    description: Local development server

components:
  securitySchemes:
    AdminApiKey:
      type: http
      scheme: bearer
      description: Admin API key for protected endpoints

    SessionCookie:
      type: apiKey
      in: cookie
      name: session_id
      description: Session cookie for authenticated user endpoints

  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
          example: "Game not found"

    CreateUserRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          example: "johndoe"
        email:
          type: string
          format: email
          example: "john@example.com"
        password:
          type: string
          format: password
          example: "securepassword123"

    UserResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
          example: 1

    UpdateUserRequest:
      type: object
      required:
        - current_password
      properties:
        username:
          type: string
          description: New username (optional)
          example: "johndoe_updated"
        email:
          type: string
          format: email
          description: New email address (optional)
          example: "newemail@example.com"
        password:
          type: string
          format: password
          description: New password (optional)
          example: "newsecurepassword456"
        current_password:
          type: string
          format: password
          description: Current password for verification
          example: "securepassword123"

    DeleteUserRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          format: password
          description: Current password for confirmation
          example: "securepassword123"

    LoginRequest:
      type: object
      required:
        - email_or_username
        - password
      properties:
        email_or_username:
          type: string
          description: Either the username or email address
          example: "johndoe"
        password:
          type: string
          format: password
          example: "securepassword123"

    SessionUserResponse:
      type: object
      required:
        - id
        - username
        - email
      properties:
        id:
          type: integer
          format: int64
          description: The user's ID
          example: 1
        username:
          type: string
          description: The user's username
          example: "johndoe"
        email:
          type: string
          format: email
          description: The user's email address
          example: "john@example.com"

    CreateGameRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Pokemon TCG"
        image_url:
          type: string
          format: uri
          nullable: true
          example: "https://example.com/pokemon-logo.png"
        card_back_image_url:
          type: string
          nullable: true
          description: Optional URL/path to standardized card back image
          example: "/images/pokemon-back.png"

    GameResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
          example: 1

    Game:
      type: object
      required:
        - id
        - name
        - set_count
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Pokemon TCG"
        image_url:
          type: string
          format: uri
          nullable: true
          example: "https://example.com/pokemon-logo.png"
        card_back_image_url:
          type: string
          nullable: true
          description: Optional URL/path to standardized card back image
          example: "/images/pokemon-back.png"
        set_count:
          type: integer
          format: int64
          description: Number of sets in this game
          example: 5

    AtlasSheet:
      type: object
      required:
        - url
        - card_count
      properties:
        url:
          type: string
          format: uri
          description: S3 URL to the atlas texture
          example: "https://s3.amazonaws.com/tcg-collection-atlases/decks/42/atlas-abc123-0.png"
        card_count:
          type: integer
          format: int64
          description: Number of cards in this atlas sheet
          example: 60

    TabletopSimulatorResponse:
      type: object
      required:
        - sheets
      properties:
        card_back:
          type: string
          description: Optional URL/path to card back image (only present if game has card_back_image_url)
          example: "/images/pokemon-back.png"
        sheets:
          type: array
          items:
            $ref: '#/components/schemas/AtlasSheet'
          description: Array of atlas textures (10x7 card grids)

    CreateSetRequest:
      type: object
      required:
        - name
        - publish_date
      properties:
        name:
          type: string
          example: "Shrouded Fable"
        image_url:
          type: string
          format: uri
          nullable: true
          example: "https://example.com/shrouded-fable.png"
        publish_date:
          type: string
          format: date
          description: ISO 8601 date (YYYY-MM-DD)
          example: "2024-08-02"

    SetResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
          example: 1

    Set:
      type: object
      required:
        - id
        - name
        - publish_date
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Shrouded Fable"
        image_url:
          type: string
          format: uri
          nullable: true
          example: "https://example.com/shrouded-fable.png"
        publish_date:
          type: string
          format: date
          description: ISO 8601 date (YYYY-MM-DD)
          example: "2024-08-02"

    CreateCardRequest:
      type: object
      required:
        - name
        - collector_number
      properties:
        name:
          type: string
          example: "Pikachu"
        collector_number:
          type: string
          description: The card's collector number within the set (can include letters/symbols)
          example: "025"
        image_url:
          type: string
          format: uri
          nullable: true
          example: "https://example.com/pikachu.png"
        attributes:
          type: object
          additionalProperties:
            type: string
          description: Key-value pairs for card attributes (e.g., rarity, type)
          example:
            rarity: "common"
            type: "electric"

    CardsResponse:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int64
          example: [1, 2, 3]

    Card:
      type: object
      required:
        - id
        - name
        - collector_number
        - attributes
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Pikachu"
        collector_number:
          type: string
          description: The card's collector number within the set (can include letters/symbols)
          example: "025"
        image_url:
          type: string
          format: uri
          nullable: true
          example: "https://example.com/pikachu.png"
        attributes:
          type: object
          additionalProperties:
            type: string
          example:
            rarity: "common"
            type: "electric"

    # Collection schemas
    CreateCollectionRequest:
      type: object
      required:
        - game_id
        - name
      properties:
        game_id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "My Pokemon Collection"

    CollectionResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
          example: 1

    UpdateCollectionRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "My Renamed Collection"

    CollectionListItem:
      type: object
      required:
        - id
        - game_id
        - name
        - created_at
        - game_name
      properties:
        id:
          type: integer
          format: int64
          example: 1
        game_id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "My Pokemon Collection"
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        game_name:
          type: string
          example: "Pokemon TCG"
        game_image_url:
          type: string
          format: uri
          nullable: true
          example: "https://example.com/pokemon-logo.png"

    CollectionDetail:
      type: object
      required:
        - id
        - game_id
        - name
        - created_at
        - game_name
        - card_count
      properties:
        id:
          type: integer
          format: int64
          example: 1
        game_id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "My Pokemon Collection"
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        game_name:
          type: string
          example: "Pokemon TCG"
        game_image_url:
          type: string
          format: uri
          nullable: true
          example: "https://example.com/pokemon-logo.png"
        card_count:
          type: integer
          format: int64
          example: 150

    CollectionCardItem:
      type: object
      required:
        - id
        - name
        - collector_number
        - attributes
        - set_id
        - set_name
        - quantity
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Pikachu"
        collector_number:
          type: string
          example: "025"
        image_url:
          type: string
          format: uri
          nullable: true
          example: "https://example.com/pikachu.png"
        attributes:
          type: object
          additionalProperties:
            type: string
          example:
            rarity: "common"
            type: "electric"
        set_id:
          type: integer
          format: int64
          example: 1
        set_name:
          type: string
          example: "Shrouded Fable"
        quantity:
          type: integer
          format: int64
          example: 3

    CardQuantityUpdate:
      type: object
      required:
        - card_id
        - quantity
      properties:
        card_id:
          type: integer
          format: int64
          example: 1
        quantity:
          type: integer
          format: int64
          description: The new quantity (0 to remove from collection)
          example: 3

    # Deck schemas
    CreateDeckRequest:
      type: object
      required:
        - collection_id
        - name
      properties:
        collection_id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Electric Theme Deck"

    DeckResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
          example: 1

    UpdateDeckRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "My Renamed Deck"

    DeckListItem:
      type: object
      required:
        - id
        - collection_id
        - name
        - created_at
        - collection_name
        - game_name
        - card_count
      properties:
        id:
          type: integer
          format: int64
          example: 1
        collection_id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Electric Theme Deck"
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00Z"
        collection_name:
          type: string
          example: "My Pokemon Collection"
        game_name:
          type: string
          example: "Pokemon TCG"
        game_image_url:
          type: string
          format: uri
          nullable: true
          example: "https://example.com/pokemon-logo.png"
        card_count:
          type: integer
          format: int64
          example: 60

    DeckCardItem:
      type: object
      required:
        - id
        - name
        - collector_number
        - attributes
        - set_id
        - set_name
        - quantity
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Pikachu"
        collector_number:
          type: string
          example: "025"
        image_url:
          type: string
          format: uri
          nullable: true
          example: "https://example.com/pikachu.png"
        attributes:
          type: object
          additionalProperties:
            type: string
          example:
            rarity: "common"
            type: "electric"
        set_id:
          type: integer
          format: int64
          example: 1
        set_name:
          type: string
          example: "Shrouded Fable"
        quantity:
          type: integer
          format: int64
          example: 4

    # Booster schemas
    CreateBoosterRequest:
      type: object
      required:
        - name
        - spec
      properties:
        name:
          type: string
          example: "Standard Booster"
        spec:
          type: object
          description: JSON specification defining the booster pack contents (slots and card selection criteria)
          example:
            slots:
              - count: 5
                filter:
                  rarity: "common"
              - count: 3
                filter:
                  rarity: "uncommon"
              - count: 1
                filter:
                  rarity: "rare"

    BoosterResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          format: int64
          example: 1

    BoosterListItem:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Standard Booster"

    OpenPacksRequest:
      type: object
      required:
        - collection_id
        - count
      properties:
        collection_id:
          type: integer
          format: int64
          description: The collection to add opened cards to
          example: 1
        count:
          type: integer
          format: int64
          description: Number of packs to open (must be positive)
          example: 3

    OpenPacksResponse:
      type: object
      required:
        - cards
      properties:
        cards:
          type: array
          items:
            $ref: '#/components/schemas/OpenedCardItem'

    OpenedCardItem:
      type: object
      required:
        - id
        - name
        - collector_number
        - attributes
        - quantity
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Pikachu"
        collector_number:
          type: string
          example: "025"
        image_url:
          type: string
          format: uri
          nullable: true
          example: "https://example.com/pikachu.png"
        attributes:
          type: object
          additionalProperties:
            type: string
          example:
            rarity: "common"
            type: "electric"
        quantity:
          type: integer
          format: int64
          description: Number of this card pulled
          example: 2

paths:
  /api/users:
    post:
      summary: Create a new user
      description: Register a new user account with username, email, and password
      operationId: createUser
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          description: Username or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                usernameExists:
                  value:
                    error: "Username already exists"
                emailExists:
                  value:
                    error: "Email already exists"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/users/{id}:
    patch:
      summary: Update user account
      description: Update username, email, and/or password. Requires current password for verification.
      operationId: updateUser
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: User ID
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '204':
          description: User updated successfully
        '400':
          description: No fields provided to update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "No fields to update"
        '401':
          description: Invalid current password or not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Invalid password"
        '403':
          description: Access denied - trying to update another user's account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Access denied"
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "User not found"
        '409':
          description: Username or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                usernameExists:
                  value:
                    error: "Username already exists"
                emailExists:
                  value:
                    error: "Email already exists"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete user account
      description: Permanently delete user account and all associated data (collections, decks, sessions). Requires password confirmation.
      operationId: deleteUser
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: User ID
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteUserRequest'
      responses:
        '204':
          description: User deleted successfully
        '401':
          description: Invalid password or not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Invalid password"
        '403':
          description: Access denied - trying to delete another user's account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Access denied"
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "User not found"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/sessions:
    post:
      summary: Login (create session)
      description: Authenticate with username/email and password. On success, sets a session_id cookie.
      operationId: login
      tags:
        - Sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: "session_id=abc123-def456; Path=/"
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Invalid credentials"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/sessions/{session_id}:
    get:
      summary: Validate session
      description: Check if a session is valid and return the associated user information. Returns 404 if the session is invalid or expired.
      operationId: getSession
      tags:
        - Sessions
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
          description: The session ID to validate
          example: "abc123-def456-ghi789"
      responses:
        '200':
          description: Session is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUserResponse'
        '404':
          description: Session not found or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Session not found"

    delete:
      summary: Logout (delete session)
      description: Delete a session by ID. Also removes the session_id cookie.
      operationId: logout
      tags:
        - Sessions
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
          description: The session ID to delete
          example: "abc123-def456-ghi789"
      responses:
        '200':
          description: Session deleted successfully
        '404':
          description: Session not found

  /api/games:
    get:
      summary: List all games
      description: Get a list of all trading card games
      operationId: listGames
      tags:
        - Games
      responses:
        '200':
          description: List of games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Game'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create a new game
      description: Create a new trading card game (admin only)
      operationId: createGame
      tags:
        - Games
      security:
        - AdminApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameRequest'
      responses:
        '200':
          description: Game created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResponse'
        '401':
          description: Unauthorized - missing or invalid API key
        '409':
          description: Game already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Game already exists"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/games/{game_id}:
    get:
      summary: Get a game by ID
      description: Get details of a specific trading card game
      operationId: getGame
      tags:
        - Games
      parameters:
        - name: game_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: The game ID
          example: 1
      responses:
        '200':
          description: Game details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '404':
          description: Game not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Game not found"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/games/{game_id}/sets:
    get:
      summary: List sets for a game
      description: Get all sets belonging to a specific game
      operationId: listSets
      tags:
        - Sets
      parameters:
        - name: game_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: The game ID
          example: 1
      responses:
        '200':
          description: List of sets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Set'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create a new set
      description: Create a new set within a game (admin only)
      operationId: createSet
      tags:
        - Sets
      security:
        - AdminApiKey: []
      parameters:
        - name: game_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: The game ID
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSetRequest'
      responses:
        '200':
