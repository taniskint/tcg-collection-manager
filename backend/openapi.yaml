      description: |
        Generates texture atlases for Tabletop Simulator from a deck.
        Creates 10x7 card grids, uploads to S3, and returns URLs.
        This endpoint is public (no authentication) to allow TTS to call it.
      operationId: generateTabletopSimulator
      tags:
        - Decks
      parameters:
        - name: deck_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Deck ID
          example: 1
      responses:
        '200':
          description: Atlas generation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TabletopSimulatorResponse'
              examples:
                withCardBack:
                  summary: Deck from game with card back
                  value:
                    card_back: "/images/pokemon-back.png"
                    sheets:
                      - url: "https://s3.amazonaws.com/tcg-collection-atlases/decks/1/atlas-abc123-0.png"
                        card_count: 60
                withoutCardBack:
                  summary: Deck from game without card back
                  value:
                    sheets:
                      - url: "https://s3.amazonaws.com/tcg-collection-atlases/decks/2/atlas-def456-0.png"
                        card_count: 40
                multipleSheets:
                  summary: Large deck with multiple sheets
                  value:
                    card_back: "/images/mtg-back.png"
                    sheets:
                      - url: "https://s3.amazonaws.com/tcg-collection-atlases/decks/3/atlas-ghi789-0.png"
                        card_count: 70
                      - url: "https://s3.amazonaws.com/tcg-collection-atlases/decks/3/atlas-ghi789-1.png"
                        card_count: 25
        '400':
          description: Bad request - deck is empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Deck is empty"
        '404':
          description: Deck not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Deck not found"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                s3NotConfigured:
                  value:
                    error: "S3 not configured"
                generationFailed:
                  value:
                    error: "Failed to generate atlases"

