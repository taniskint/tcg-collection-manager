<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Deck - TCG Collection Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Core styles -->
    <link rel="stylesheet" href="css/core/variables.css">
    <link rel="stylesheet" href="css/core/reset.css">
    <link rel="stylesheet" href="css/navigation/nav.css">
    <!-- Components -->
    <link rel="stylesheet" href="css/components/buttons.css">
    <link rel="stylesheet" href="css/components/breadcrumb.css">
    <link rel="stylesheet" href="css/components/page-header.css">
    <link rel="stylesheet" href="css/components/cards.css">
    <link rel="stylesheet" href="css/components/filters.css">
    <link rel="stylesheet" href="css/components/sorting.css">
    <link rel="stylesheet" href="css/components/modal.css">
    <link rel="stylesheet" href="css/components/forms.css">
    <link rel="stylesheet" href="css/components/quantity.css">
    <link rel="stylesheet" href="css/components/states.css">
    <!-- Page-specific -->
    <link rel="stylesheet" href="css/pages/deck.css">
</head>
<body>
    <nav>
        <div class="nav-header">
            <a href="index.html"><p>TCG Collection Manager</p></a>
            <div id="show-links" class="show-links">+</div>
        </div>
        <ul hidden id="nav-links" class="nav-links">
            <li><a href="games.html"><p>Games</p></a></li>
            <li><a href="collections.html"><p>Collections</p></a></li>
            <li><a href="decks.html"><p>Decks</p></a></li>
            <li><a href="account.html"><p>Account</p></a></li>
            <li><button id="logout-btn">Log Out</button></li>
        </ul>
    </nav>

    <main>
        <section id="page-header" class="page-header" hidden>
            <div class="page-header-card">
                <nav class="breadcrumb">
                    <a href="decks.html">Decks</a>
                    <span class="breadcrumb-separator">/</span>
                    <span id="breadcrumb-deck" class="breadcrumb-current"></span>
                </nav>
                <div class="page-header-content">
                    <img id="game-logo" src="" alt="" class="page-header-logo">
                    <div class="page-header-text">
                        <h1 id="deck-name"></h1>
                        <p id="deck-collection"></p>
                        <p class="deck-meta"><span id="stat-cards">0</span> cards · Created <span id="stat-created"></span></p>
                    </div>
                    <div class="page-header-actions">
                        <button class="btn btn-secondary" id="edit-name-btn">Edit Name</button>
                        <button class="btn btn-secondary" id="delete-deck-btn">Delete</button>
                        <button class="btn btn-primary" id="add-cards-btn" disabled>+ Add Cards</button>
                    </div>
                </div>
            </div>
        </section>

        <section id="filters-section" class="filters-section" hidden>
            <div class="search-bar">
                <input type="text" id="card-search" placeholder="Search cards by name..." class="search-input">
            </div>
            <div class="filters-row" id="basic-filters">
                <div class="filter-group">
                    <label for="filter-set">Set</label>
                    <select id="filter-set" class="filter-select">
                        <option value="">All Sets</option>
                    </select>
                </div>
                <div id="attribute-filters"></div>
                <button class="btn btn-secondary filter-clear" id="clear-filters">Clear Filters</button>
            </div>
        </section>

        <section id="sorting-section" class="sorting-section" hidden>
            <div class="sorting-rows" id="sorting-rows">
                <div class="sort-group" data-sort-level="0">
                    <label>Sort by</label>
                    <select class="filter-select sort-field">
                        <option value="id">Default</option>
                        <option value="name">Name</option>
                        <option value="collector_number">Card Number</option>
                        <option value="quantity">Quantity</option>
                        <option value="set_name">Set</option>
                    </select>
                    <select class="filter-select order-select">
                        <option value="asc">Asc</option>
                        <option value="desc">Desc</option>
                    </select>
                    <button class="btn-icon sort-add" id="add-sort-level" title="Add sort level">+</button>
                </div>
            </div>
        </section>

        <section id="cards-grid" class="cards-grid" hidden>
        </section>

        <section id="cards-empty" class="cards-empty" hidden>
            <p>No cards in this deck yet. Click "Add Cards" to add cards from your collection.</p>
        </section>

        <div id="deck-loading" class="deck-loading">
            <p>Loading deck...</p>
        </div>

        <div id="deck-error" class="deck-error" hidden>
            <p>Failed to load deck.</p>
            <a href="decks.html" class="btn btn-secondary">Return to Decks</a>
        </div>
    </main>

    <!-- Edit Name Modal -->
    <div id="edit-name-modal" class="modal" hidden>
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Deck Name</h2>
                <button type="button" class="modal-close" id="edit-name-close">&times;</button>
            </div>
            <form id="edit-name-form">
                <div class="form-group">
                    <label for="new-deck-name">Deck Name</label>
                    <input type="text" id="new-deck-name" name="new-deck-name" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="edit-name-cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add Cards Modal -->
    <div class="modal-overlay" id="add-cards-modal" hidden>
        <div class="modal modal-large">
            <div class="modal-header">
                <h2>Add Cards to Deck</h2>
                <button class="btn-icon modal-close" id="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-filters">
                    <div class="add-cards-search">
                        <input type="text" id="add-card-search" placeholder="Search for a card..." class="search-input">
                        <select id="add-card-set" class="filter-select">
                            <option value="">All Sets</option>
                        </select>
                    </div>
                    <div class="modal-attribute-filters" id="modal-attribute-filters"></div>
                    <div class="modal-sorting">
                        <label>Sort by</label>
                        <select id="modal-sort-field" class="filter-select">
                            <option value="id">Default</option>
                            <option value="name">Name</option>
                            <option value="collector_number">Card Number</option>
                            <option value="quantity">Quantity</option>
                            <option value="set_name">Set</option>
                        </select>
                        <select id="modal-sort-order" class="filter-select">
                            <option value="asc">Asc</option>
                            <option value="desc">Desc</option>
                        </select>
                    </div>
                </div>
                <div id="add-cards-results" class="add-cards-results">
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
                <button class="btn btn-primary" id="modal-submit">Add Selected Cards</button>
            </div>
        </div>
    </div>

    <script type="module" src="dist/deck.js"></script>
</body>
</html>
