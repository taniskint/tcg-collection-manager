<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cards - TCG Collection Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Core styles -->
    <link rel="stylesheet" href="css/core/variables.css">
    <link rel="stylesheet" href="css/core/reset.css">
    <link rel="stylesheet" href="css/navigation/nav.css">
    <!-- Components -->
    <link rel="stylesheet" href="css/components/buttons.css">
    <link rel="stylesheet" href="css/components/breadcrumb.css">
    <link rel="stylesheet" href="css/components/page-header.css">
    <link rel="stylesheet" href="css/components/cards.css">
    <link rel="stylesheet" href="css/components/modal.css">
    <link rel="stylesheet" href="css/components/forms.css">
    <link rel="stylesheet" href="css/components/states.css">
    <!-- Page-specific -->
    <link rel="stylesheet" href="css/pages/cards.css">
</head>
<body>
    <nav>
        <div class="nav-header">
            <a href="index.html"><p>TCG Collection Manager</p></a>
            <div id="show-links" class="show-links">+</div>
        </div>
        <ul hidden id="nav-links" class="nav-links">
            <li><a href="games.html"><p>Games</p></a></li>
            <li><a href="collections.html"><p>Collections</p></a></li>
            <li><a href="decks.html"><p>Decks</p></a></li>
            <li><a href="account.html"><p>Account</p></a></li>
            <li><button id="logout-btn">Log Out</button></li>
        </ul>
    </nav>

    <main>
        <section id="page-header" class="page-header" hidden>
            <div class="page-header-card">
                <nav class="breadcrumb">
                    <a href="games.html">Games</a>
                    <span class="breadcrumb-separator">/</span>
                    <a id="breadcrumb-game" href="#"></a>
                    <span class="breadcrumb-separator">/</span>
                    <span id="breadcrumb-set" class="breadcrumb-current"></span>
                </nav>
                <div class="page-header-content">
                    <img id="set-logo" src="" alt="" class="page-header-logo" hidden>
                    <div class="page-header-text">
                        <h1 id="set-name"></h1>
                        <p id="card-count"></p>
                    </div>
                    <div class="page-header-actions">
                        <button class="btn btn-primary" id="open-pack-btn" disabled>Open Booster Pack</button>
                    </div>
                </div>
            </div>
        </section>

        <div id="cards-loading" class="cards-loading">
            <p>Loading cards...</p>
        </div>

        <div id="cards-error" class="cards-error" hidden>
            <p>Failed to load cards. <a href="games.html">Return to games</a></p>
        </div>

        <div id="cards-empty" class="cards-empty" hidden>
            <p>No cards in this set yet.</p>
        </div>

        <section id="cards-grid" class="cards-grid" hidden>
            <!-- Cards loaded dynamically -->
        </section>
    </main>

    <div class="modal-overlay" id="open-pack-modal" hidden>
        <div class="modal">
            <div class="modal-header">
                <h2>Open Booster Pack</h2>
                <button class="btn-icon modal-close" id="pack-modal-close">&times;</button>
            </div>
            <form class="modal-form" id="open-pack-form">
                <div class="form-group">
                    <label for="pack-type">Pack Type</label>
                    <select id="pack-type" name="pack-type" required>
                        <option value="">Select a pack...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="pack-quantity">Quantity</label>
                    <input type="number" id="pack-quantity" name="pack-quantity" min="1" max="36" value="1" required>
                </div>
                <div class="form-group">
                    <label for="pack-collection">Add cards to collection</label>
                    <select id="pack-collection" name="pack-collection" required>
                        <option value="">Select a collection...</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="pack-modal-cancel">Cancel</button>
                    <button type="submit" class="btn btn-primary">Open Packs</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="pack-results-modal" hidden>
        <div class="modal modal-xl">
            <div class="modal-header">
                <h2 id="results-title">You opened packs!</h2>
                <button class="btn-icon modal-close" id="results-modal-close">&times;</button>
            </div>
            <div class="modal-body pack-results-body">
                <p id="results-summary" class="pack-results-info"></p>
                <div id="pack-results-grid" class="pack-results-grid"></div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="results-open-another">Open More Packs</button>
                <button class="btn btn-primary" id="results-done">Done</button>
            </div>
        </div>
    </div>

    <script type="module" src="dist/cards.js"></script>
</body>
</html>
