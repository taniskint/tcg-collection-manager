<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Games - TCG Collection Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="games.css">
</head>
<body>
    <nav>
        <div class="nav-header">
            <a href="index.html"><p>TCG Collection Manager</p></a>
            <div id="show-links" class="show-links">+</div>
        </div>
        <ul hidden id="nav-links" class="nav-links">
            <li><a href="games.html"><p>Games</p></a></li>
            <li><a href="collections.html"><p>Collections</p></a></li>
            <li><a href="decks.html"><p>Decks</p></a></li>
            <li><a href="account.html"><p>Account</p></a></li>
            <li><button id="logout-btn">Log Out</button></li>

    <main>
        <section class="page-header">
            <h1>Games</h1>
            <p>Browse trading card games to explore sets and cards.</p>

        <div id="games-loading" class="games-loading">
            <p>Loading games...</p>
        </div>

            <p>No games available yet.</p>
        </div>

        <section id="games-grid" class="games-grid" hidden>
            <!-- Games loaded dynamically -->
        </section>

    <script type="module" src="dist/games.js"></script>
