<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Collections - TCG Collection Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Core styles -->
    <link rel="stylesheet" href="css/core/variables.css">
    <link rel="stylesheet" href="css/core/reset.css">
    <link rel="stylesheet" href="css/navigation/nav.css">
    <!-- Components -->
    <link rel="stylesheet" href="css/components/buttons.css">
    <link rel="stylesheet" href="css/components/page-header.css">
    <link rel="stylesheet" href="css/components/modal.css">
    <link rel="stylesheet" href="css/components/forms.css">
    <link rel="stylesheet" href="css/components/states.css">
    <!-- Page-specific -->
    <link rel="stylesheet" href="css/pages/collections.css">
</head>
<body>
    <nav>
        <div class="nav-header">
            <a href="index.html"><p>TCG Collection Manager</p></a>
            <div id="show-links" class="show-links">+</div>
        </div>
        <ul hidden id="nav-links" class="nav-links">
            <li><a href="games.html"><p>Games</p></a></li>
            <li><a href="collections.html"><p>Collections</p></a></li>
            <li><a href="decks.html"><p>Decks</p></a></li>
            <li><a href="account.html"><p>Account</p></a></li>
            <li><button id="logout-btn">Log Out</button></li>
        </ul>
    </nav>

    <main>
        <section class="page-header">
            <div class="page-header-row">
                <div>
                    <h1>My Collections</h1>
                    <p>Manage your card collections across different games.</p>
                </div>
                <button id="new-collection-btn" class="btn btn-primary" hidden>New Collection</button>
            </div>
        </section>

        <div id="create-modal" class="modal" hidden>
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Create Collection</h2>
                    <button id="close-modal-btn" class="modal-close">&times;</button>
                </div>
                <form id="create-collection-form">
                    <div class="form-group">
                        <label for="game-select">Game</label>
                        <select id="game-select" required>
                            <option value="">Select a game...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="collection-name">Collection Name</label>
                        <input type="text" id="collection-name" required placeholder="My Collection">
                    </div>
                    <div id="form-error" class="form-error" hidden></div>
                    <div class="form-actions">
                        <button type="button" id="cancel-btn" class="btn btn-secondary">Cancel</button>
                        <button type="submit" class="btn btn-primary">Create</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="collections-loading" class="collections-loading">
            <p>Loading collections...</p>
        </div>

        <div id="collections-error" class="collections-error" hidden>
            <p>You must be logged in to view collections.</p>
            <a href="login.html" class="btn btn-primary">Log In</a>
        </div>

        <div id="collections-empty" class="collections-empty" hidden>
            <p>You don't have any collections yet.</p>
        </div>

        <section id="collections-grid" class="collections-grid" hidden>
            <!-- Collections loaded dynamically -->
        </section>
    </main>

    <script type="module" src="dist/collections.js"></script>
</body>
</html>
